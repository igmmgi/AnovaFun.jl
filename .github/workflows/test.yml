name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      
      - name: Install dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
          '
      
      - name: Run tests
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.test()
          '
